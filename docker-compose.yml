name: remnachillbot

services:
  bot:
    # Образ этого форка (собирается GitHub Actions из ветки main).
    # :latest — свежая сборка main, :dev — превью из ветки dev,
    # :sha-xxxxxxx — конкретная сборка.
    image: ghcr.io/wuwkos/bot:latest
    pull_policy: always
    container_name: remnabot
    restart: unless-stopped
    environment:
      BOT_TOKEN: "ВПИШИТЕ_ТОКЕН_БОТА"
      ADMIN_TELEGRAM_ID: "ВПИШИТЕ_ВАШ_TELEGRAM_ID"
      DATA_DIR: /data
      COMPOSE_PROJECT: remnachillbot
      COMPOSE_FILE_PATH: /compose/docker-compose.yml
      COMPOSE_HOST_DIR: /opt/remnachillbot
      PANEL_CONTAINER: remnawave
      # Репозиторий, с которым сверяется проверка обновлений (/update).
      # У форка он свой — иначе баннеры «доступно обновление» показывают
      # коммиты апстрима, а не вашего образа.
      UPDATE_REPO: "wuwkos/Bot"
      # Если панель закрыта аддоном «Caddy with security» (docs.rw → Panel security),
      # впишите сюда X-Api-Key из портала — бот добавит его ко всем запросам к панели.
      # CADDY_AUTH_API_TOKEN: ""
    volumes:
      - bot-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/remnachillbot:/compose
      # Свой дизайн мини-аппа/кабинета: раскомментируйте и положите файлы в ./custom
      # (index.html — общий, miniapp.html / cabinet.html — раздельные; см. README)
      # - /opt/remnachillbot/custom:/custom:ro

volumes:
  bot-data:
